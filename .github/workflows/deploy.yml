name: Deploy to turgunboev.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp offline cache with this version
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" public/sw.js
      - name: Stamp the Now section with this month (Tashkent time)
        run: sed -i -E "s/Updated [A-Z][a-z]+ [0-9]{4}/Updated $(TZ=Asia/Tashkent date +'%B %Y')/" public/index.html
      - name: Version images, fonts and scripts (long browser caching, always fresh after changes)
        run: python3 scripts/version_assets.py
      - name: Deploy to Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7c34c932379b8c11bdb54280856f159a
          command: deploy
          wranglerVersion: "4.168.0"
