<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline - Turgunboev Bekhzod</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070707">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070707'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Impact,Arial Black,sans-serif' font-size='28' fill='%23F3F1EC'%3EB.T.%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:'Anton';font-weight:400;font-display:swap;src:url(/fonts/anton-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url(/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url(/fonts/inter-latin-600-normal.woff2) format('woff2')}
:root{--bg:#070707;--fg:#F3F1EC;--mut:#9B978F;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{padding:24px clamp(20px,4vw,56px)}
.logo{font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:.1em}
main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 20px}
.hz{animation-iteration-count:1;position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(243,241,236,.5) 20%,#fff 50%,rgba(243,241,236,.5) 80%,transparent);box-shadow:0 0 18px rgba(255,214,170,.45);transform:scaleX(0);animation:draw 1.6s var(--ease) .2s forwards}
.big{position:relative;font-family:Anton,Impact,sans-serif;font-size:clamp(120px,34vw,420px);line-height:.8;letter-spacing:.01em;color:transparent;-webkit-text-stroke:1px rgba(243,241,236,.35);opacity:0;animation:rise 1.4s var(--ease) .5s forwards}
.copy{position:absolute;left:0;right:0;top:calc(50% + clamp(70px,12vw,170px));display:flex;flex-direction:column;align-items:center;gap:22px;opacity:0;animation:fade 1s var(--ease) 1.1s forwards}
.copy h1{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(28px,5vw,48px);line-height:1}
.copy p{color:var(--mut);font-size:15px}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 30px;border:1px solid var(--fg);font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;transition:background .5s var(--ease),color .5s var(--ease)}
.btn:hover,.btn:focus-visible{background:var(--fg);color:var(--bg);outline:none}
@keyframes draw{to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hz,.big,.copy{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<main>
  <i class="hz" aria-hidden="true"></i>
  <div class="big" aria-hidden="true">Calm</div>
  <div class="copy">
    <h1>No signal.</h1>
    <p>You're offline. The site will come back the moment you reconnect.</p>
    <a class="btn" href="/" id="re">Try again →</a>
  </div>
</main>
<script>addEventListener("online",function(){location.replace("/")});document.getElementById("re").addEventListener("click",function(e){e.preventDefault();location.replace("/")})</script>
</body>
</html>
